<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clinic Booking</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f6f7f9; color: #16181d; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e8eaed; }
    .card { background: #1c1f25 !important; border-color: #2a2e36 !important; }
    .slot, input { background: #23272f !important; color: #e8eaed !important; border-color: #343943 !important; }
  }
  header { padding: 28px 20px 8px; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { margin: 0; opacity: .7; font-size: .95rem; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 20px 64px; }
  .card {
    background: #fff; border: 1px solid #e3e6ea; border-radius: 12px;
    padding: 18px; margin: 16px 0;
  }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 10px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; border-radius: 8px;
    border: 1px solid #cfd4da; background: #fff;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1 1 220px; }
  .slot {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px; border: 1px solid #e3e6ea; border-radius: 10px; margin-bottom: 8px;
    background: #fbfbfc;
  }
  .slot .meta { font-size: .9rem; }
  .slot .when { font-weight: 600; }
  .slot.booked { opacity: .5; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    border: 1px solid transparent; padding: 9px 14px; background: #2563eb; color: #fff;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: inherit; border-color: #cfd4da; }
  button.danger { background: #dc2626; }
  .banner { padding: 10px 12px; border-radius: 8px; font-size: .9rem; margin: 12px 0; display: none; }
  .banner.ok { display: block; background: #dcfce7; color: #14532d; }
  .banner.err { display: block; background: #fee2e2; color: #7f1d1d; }
  .booking { border-top: 1px solid #e3e6ea; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .booking:first-of-type { border-top: 0; }
  .pill { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; color: #374151; }
  .pill.cancelled { background: #fde68a; color: #78350f; }
  .empty { opacity: .6; font-size: .9rem; }
  code { font-size: .8rem; opacity: .6; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>Clinic Booking</h1>
  <p class="sub">View available slots, book an appointment, and manage your bookings.</p>
</header>

<main>
  <div class="card">
    <h2>Your details</h2>
    <div class="row">
      <div>
        <label for="name">Full name</label>
        <input id="name" placeholder="Ada Lovelace" autocomplete="name" />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="ada@example.com" autocomplete="email" />
      </div>
    </div>
    <div id="banner" class="banner" role="status"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <h2 style="margin:0">Available slots</h2>
      <div style="display:flex;gap:8px">
        <button class="ghost" id="refresh">Refresh</button>
        <button class="ghost" id="more-slots">Load more slots</button>
      </div>
    </div>
    <div id="slots"><p class="empty">Loading…</p></div>
  </div>

  <div class="card">
    <h2>My bookings</h2>
    <div id="bookings"><p class="empty">Enter your email and press “Load bookings”.</p></div>
    <div style="margin-top:12px">
      <button class="ghost" id="load-bookings">Load bookings</button>
    </div>
  </div>

  <p><code id="api-info"></code></p>
</main>

<script>
  const API_KEY = "clinic-book-api-key-2026";
  const API = "/";

  const $ = (id) => document.getElementById(id);
  const nameEl = $("name");
  const emailEl = $("email");
  const banner = $("banner");
  // Slot details for booking rows; entries survive slot-list refreshes so old
  // bookings still show their provider and time.
  const slotCache = new Map();

  $("api-info").textContent = "API base: " + location.origin;

  function show(kind, msg) {
    banner.className = "banner " + kind;
    banner.textContent = msg;
    if (kind === "ok") setTimeout(() => { banner.className = "banner"; }, 4000);
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: {
        "X-API-Key": API_KEY,
        "Content-Type": "application/json",
        ...(opts.headers || {}),
      },
    });
    let body = null;
    try { body = await res.json(); } catch (_) {}
    if (!res.ok) {
      const err = new Error((body && body.error) || "Request failed");
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  }

  function fmt(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleString(undefined, {
      weekday: "short", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  }

  function timeOnly(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function messageFor(err) {
    if (err.status === 429) {
      const s = err.body && err.body.retry_after;
      return "Too many attempts. Try again in " + (s ? s + "s" : "a minute") + ".";
    }
    if (err.status === 409) return "That slot is already booked.";
    if (err.status === 404) return "Not found.";
    if (err.status === 401) return "API key rejected.";
    return err.message || "Something went wrong.";
  }

  async function loadSlots() {
    const box = $("slots");
    box.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const data = await api("slots");
      for (const s of data.slots || []) slotCache.set(s.id, s);
      if (!data.slots || !data.slots.length) {
        box.innerHTML = '<p class="empty">No slots available.</p>';
        return;
      }
      box.innerHTML = "";
      for (const s of data.slots) {
        const row = document.createElement("div");
        row.className = "slot" + (s.available ? "" : " booked");
        row.innerHTML =
          '<div class="meta"><div class="when">' + fmt(s.start) + " – " +
          new Date(s.end).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) +
          "</div><div>" + s.provider + "</div></div>";
        const btn = document.createElement("button");
        btn.textContent = s.available ? "Book" : "Booked";
        btn.disabled = !s.available;
        btn.addEventListener("click", () => book(s.id, btn));
        row.appendChild(btn);
        box.appendChild(row);
      }
    } catch (err) {
      box.innerHTML = '<p class="empty">Could not load slots.</p>';
      show("err", messageFor(err));
    }
  }

  async function book(slotId, btn) {
    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    if (!name || !email) {
      show("err", "Enter your name and email first.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Booking…";
    try {
      const b = await api("bookings", {
        method: "POST",
        body: JSON.stringify({ slot_id: slotId, name, email }),
        headers: { "Idempotency-Key": crypto.randomUUID() },
      });
      show("ok", "Booked! Confirmation " + b.id.slice(0, 8) + " for " + fmt(b.created_at));
      await loadSlots();
      await loadBookings();
    } catch (err) {
      show("err", messageFor(err));
      btn.disabled = false;
      btn.textContent = "Book";
    }
  }

  async function loadBookings() {
    const email = emailEl.value.trim();
    const box = $("bookings");
    if (!email) {
      show("err", "Enter your email to load bookings.");
      return;
    }
    box.innerHTML = '<p class="empty">Loading…</p>';
    try {
      // Provider and start time live on the slot, so make sure we have them.
      if (!slotCache.size) await loadSlots();
      const data = await api("bookings?email=" + encodeURIComponent(email));
      if (!data.bookings || !data.bookings.length) {
        box.innerHTML = '<p class="empty">No bookings for this email yet.</p>';
        return;
      }
      box.innerHTML = "";
      for (const b of data.bookings) {
        const row = document.createElement("div");
        row.className = "booking";
        const status = b.status === "cancelled"
          ? '<span class="pill cancelled">cancelled</span>'
          : '<span class="pill">confirmed</span>';
        const slot = slotCache.get(b.slot_id);
        const heading = slot ? slot.provider : b.slot_id;
        const when = slot
          ? fmt(slot.start) + " – " + timeOnly(slot.end)
          : "Time unavailable";
        row.innerHTML =
          "<div><strong>" + heading + "</strong> " + status +
          '<div class="empty">' + when + "</div></div>";
        if (b.status !== "cancelled") {
          const btn = document.createElement("button");
          btn.className = "danger";
          btn.textContent = "Cancel";
          btn.addEventListener("click", () => cancel(b.id, btn));
          row.appendChild(btn);
        }
        box.appendChild(row);
      }
    } catch (err) {
      box.innerHTML = '<p class="empty">Could not load bookings.</p>';
      show("err", messageFor(err));
    }
  }

  async function cancel(id, btn) {
    btn.disabled = true;
    try {
      await api("bookings/" + encodeURIComponent(id), { method: "DELETE" });
      show("ok", "Booking cancelled.");
      await loadBookings();
      await loadSlots();
    } catch (err) {
      show("err", messageFor(err));
      btn.disabled = false;
    }
  }

  async function loadMoreSlots() {
    const btn = $("more-slots");
    btn.disabled = true;
    btn.textContent = "Adding…";
    try {
      const data = await api("demo-slots", { method: "POST" });
      show("ok", "Added " + data.added + " more slots.");
      await loadSlots();
    } catch (err) {
      show("err", messageFor(err));
    } finally {
      btn.disabled = false;
      btn.textContent = "Load more slots";
    }
  }

  $("refresh").addEventListener("click", loadSlots);
  $("more-slots").addEventListener("click", loadMoreSlots);
  $("load-bookings").addEventListener("click", loadBookings);
  loadSlots();
</script>
</body>
</html>
