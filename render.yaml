databases:
  - name: clinic-booking-db
    plan: free
    region: oregon

services:
  - type: web
    name: clinic-booking-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: API_KEY
        value: clinic-book-api-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
